<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musfiqur Rahman Digital Card</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .card-wrap {
      position: relative;
      width: 1200px;
      max-width: 100%;
    }

    .card-wrap img {
      width: 100%;
      display: block;
    }

    .cover {
      position: absolute;
      background: #c9eee7;
      border-radius: 4px;
    }

    .text {
      position: absolute;
      color: #083b3a;
    }

    .name {
      top: 30px;
      left: 40px;
      font-size: 42px;
      font-weight: bold;
    }

    .line1 {
      top: 92px;
      left: 40px;
      font-size: 30px;
    }

    .line2 {
      top: 133px;
      left: 40px;
      font-size: 28px;
    }

    .line3 {
      top: 174px;
      left: 40px;
      font-size: 30px;
    }

    .line4 {
      top: 215px;
      left: 40px;
      font-size: 26px;
    }

    .email {
      top: 268px;
      left: 110px;
      font-size: 32px;
    }
  </style>
</head>

<body>
  <div class="card-wrap">

    <img src="https://musfiqurrahman.github.io/images/Musfiqur_Rahman_Digital_Card.png"
         alt="Musfiqur Rahman digital card background">

    <!-- Cover old top information -->
    <div class="cover"
         style="
           top: 18px;
           left: 18px;
           width: 1085px;
           height: 235px;
         ">
    </div>

    <!-- Cover old email only -->
    <div class="cover"
         style="
           top: 267px;
           left: 110px;
           width: 760px;
           height: 50px;
         ">
    </div>

    <!-- New updated text -->
    <div class="text name">Musfiqur Rahman, Ph.D.</div>
    <div class="text line1">Postdoctoral Research Associate</div>
    <div class="text line2">Department of Engineering</div>
    <div class="text line3">Texas A&amp;M University–Corpus Christi</div>
    <div class="text line4">Corpus Christi, Texas, USA</div>

    <div class="text email">musfiqur.rahman@tamucc.edu</div>

  </div>
</body>
</html>
